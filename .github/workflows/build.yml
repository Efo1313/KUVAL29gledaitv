name: Eklenti Derleyici

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Java Ortamını Kur
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Derleme Yetkisi Ver
        run: chmod +x gradlew || true

      - name: Eklentiyi Derle
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew make
          else
            echo "Gradlew bulunamadı, genel gradle deneniyor..."
            gradle make || echo "Lütfen build.gradle dosyalarınızı kontrol edin."
          fi
