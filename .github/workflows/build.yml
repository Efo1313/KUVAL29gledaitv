name: Eklenti Derleyici

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Java Ortamını Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Derleme Yetkisi Ver
        run: chmod +x gradlew || true

      - name: Eklentiyi Derle ve Repo Oluştur
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew make
            ./gradlew makeRepo
          else
            echo "Gradlew bulunamadı."
            exit 1
          fi

      - name: GitHub Pages Ayarla
        uses: actions/configure-pages@v5
        
      - name: Çıktıları Güncel Sürümle Paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: './repo'

      - name: Canlıya Al
        uses: actions/deploy-pages@v4
