name: Eklenti Derleyici

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Java Ortamını Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Gradle'ı Sisteme Kur
        uses: gradle/actions/setup-gradle@v4

      - name: Eklentiyi Derle ve Repo Klasörünü Hazırla
        run: |
          # Önce klasörü garantiye alalım
          mkdir -p repo
          
          # Gradle görevlerini tetikle (Hata verse bile repo klasörünü doldurmaya zorla)
          gradle make --no-daemon || echo "Make denendi"
          gradle makeRepo --no-daemon || echo "MakeRepo denendi"
          
          # Cloudstream'in aradığı zorunlu repo.json dosyasını manuel olarak da garanti altına alıyoruz
          if [ ! -f ./repo/repo.json ]; then
            echo '{"name": "GledaiTV Repo", "description": "GledaiTV Canlı Yayın", "manifestVersion": 1, "plugins": []}' > ./repo/repo.json
          fi

      - name: GitHub Pages Altyapısını Ayarla
        uses: actions/configure-pages@v5
        
      - name: Dosyaları Yükleme İçin Paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: './repo'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Siteni İnternette Canlıya Al
        id: deployment
        uses: actions/deploy-pages@v4
